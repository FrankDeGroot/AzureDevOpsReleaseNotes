services:
  workspace:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    command: infinity
    entrypoint: sleep
    volumes:
      - ..:/workspaces/AzureDevOpsReleaseNotes:cached
    network_mode: service:azurite
    depends_on:
      - azurite
    environment:
      AzureWebJobsStorage: UseDevelopmentStorage=true
      Storage__ConnectionString: UseDevelopmentStorage=true
      Storage__TableName: releases

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data
    volumes:
      - azurite-data:/data

volumes:
  azurite-data:

services:
  workspace:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    command: infinity
    entrypoint: sleep
    volumes:
      - ..:/workspaces/AzureDevOpsReleaseNotes:cached
    network_mode: service:cosmosdb
    depends_on:
      - cosmosdb
    environment:
      Cosmos__ConnectionString: AccountEndpoint=https://localhost:8081/;AccountKey=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==;
      Cosmos__Database: release-notes
      Cosmos__Container: releases

  cosmosdb:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    environment:
      PROTOCOL: https
      EXPLORER_PROTOCOL: http
      KEY_FILE: /emulator.key
      ENABLE_TELEMETRY: "false"
    volumes:
      - cosmos-data:/data
      - ./cosmos-emulator.key:/emulator.key:ro

volumes:
  cosmos-data:
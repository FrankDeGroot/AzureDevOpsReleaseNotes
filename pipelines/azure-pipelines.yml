trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  group: AzureDevOpsReleaseNotes
# Assumes the linked variable group provides:
# - releaseNotesApiUrl
# - releaseNotesFunctionKey (secret)

steps:
- task: PowerShell@2
  displayName: Compile release notes
  inputs:
    targetType: inline
    script: |
      $payload = @{
        organization = "$(System.CollectionUri)".TrimEnd('/') -replace '^https://dev.azure.com/', ''
        project = "$(System.TeamProject)"
        projectId = "$(System.TeamProjectId)"
        buildId = [int]"$(Build.BuildId)"
        repositoryId = "$(Build.Repository.ID)"
      } | ConvertTo-Json

      $headers = @{
        'x-functions-key' = "$(releaseNotesFunctionKey)"
      }
      Invoke-RestMethod -Method Post -Uri "$(releaseNotesApiUrl)" -Headers $headers -Body $payload -ContentType 'application/json'
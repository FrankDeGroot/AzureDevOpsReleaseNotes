name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: deploy_infrastructure
        run: |
          deployment_json=$(az deployment sub create \
            --name "release-notes-${{ github.run_id }}" \
            --location "${{ vars.AZURE_LOCATION }}" \
            --template-file infra/main.bicep \
            --parameters location="${{ vars.AZURE_LOCATION }}" resourceNameSuffix="${{ vars.AZURE_RESOURCE_SUFFIX }}" \
            --query 'properties.outputs' \
            --output json)
          echo "static_web_app_name=$(echo "$deployment_json" | jq -r '.staticWebAppName.value')" >> "$GITHUB_OUTPUT"
          echo "function_app_name=$(echo "$deployment_json" | jq -r '.functionAppName.value')" >> "$GITHUB_OUTPUT"
          echo "function_app_default_hostname=$(echo "$deployment_json" | jq -r '.functionAppDefaultHostname.value')" >> "$GITHUB_OUTPUT"
          echo "app_insights_connection_string=$(echo "$deployment_json" | jq -r '.appInsightsConnectionString.value')" >> "$GITHUB_OUTPUT"

      - name: Get Static Web App deployment token
        id: static_web_app_token
        env:
          STATIC_WEB_APP_NAME: ${{ steps.deploy_infrastructure.outputs.static_web_app_name }}
        run: |
          deployment_token=$(az staticwebapp secrets list \
            --name "$STATIC_WEB_APP_NAME" \
            --resource-group rg-azure-devops-release-notes \
            --query 'properties.apiKey' \
            --output tsv)
          echo "::add-mask::$deployment_token"
          echo "token=$deployment_token" >> "$GITHUB_OUTPUT"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run Tests
        run: dotnet test --configuration Release --filter "Category!=Integration"

      - name: Build and Publish Client (Blazor WebAssembly)
        env:
          APP_INSIGHTS_CONNECTION_STRING: ${{ steps.deploy_infrastructure.outputs.app_insights_connection_string }}
        run: |
          if [ -n "$APP_INSIGHTS_CONNECTION_STRING" ] && [ "$APP_INSIGHTS_CONNECTION_STRING" != "null" ]; then
            jq --arg cs "$APP_INSIGHTS_CONNECTION_STRING" '.ApplicationInsights.ConnectionString = $cs' src/Client/wwwroot/appsettings.json > src/Client/wwwroot/appsettings.json.tmp && mv src/Client/wwwroot/appsettings.json.tmp src/Client/wwwroot/appsettings.json
          fi
          dotnet publish src/Client/Client.csproj -c Release -o bin/client-publish

      - name: Build and Publish API (Azure Functions)
        run: dotnet publish src/Api/Api.csproj -c Release -o bin/api-publish

      - name: Deploy API (Azure Functions)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.deploy_infrastructure.outputs.function_app_name }}
          package: bin/api-publish

      - name: Run Integration Tests (deployed API)
        env:
          FUNCTION_APP_NAME: ${{ steps.deploy_infrastructure.outputs.function_app_name }}
          FUNCTION_APP_HOSTNAME: ${{ steps.deploy_infrastructure.outputs.function_app_default_hostname }}
          AZURE_DEVOPS_ORGANIZATION: ${{ vars.AZURE_DEVOPS_ORGANIZATION }}
          AZURE_DEVOPS_PROJECT: ${{ vars.AZURE_DEVOPS_PROJECT }}
          AZURE_DEVOPS_PROJECT_ID: ${{ vars.AZURE_DEVOPS_PROJECT_ID }}
          AZURE_DEVOPS_REPOSITORY_ID: ${{ vars.AZURE_DEVOPS_REPOSITORY_ID }}
          AZURE_DEVOPS_BUILD_ID: ${{ vars.AZURE_DEVOPS_BUILD_ID }}
        run: |
          function_key=$(az functionapp keys list \
            --name "$FUNCTION_APP_NAME" \
            --resource-group rg-azure-devops-release-notes \
            --query 'functionKeys.default' \
            --output tsv)
          echo "::add-mask::$function_key"
          export FUNCTION_KEY="$function_key"
          export RELEASE_NOTES_API_URL="https://$FUNCTION_APP_HOSTNAME/api"

          # GET releases also creates the Cosmos container, which health only reads.
          for attempt in $(seq 1 20); do
            if curl --silent --fail --max-time 30 "$RELEASE_NOTES_API_URL/releases?project=warmup" > /dev/null; then
              echo "API ready after $attempt attempt(s)."
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "::warning::API did not become ready; running integration tests for diagnostics."
            else
              sleep 15
            fi
          done

          dotnet test tests/Api.IntegrationTests --configuration Release --filter "Category=Integration"

      - name: Deploy Client (Azure Static Web Apps)
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.static_web_app_token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "bin/client-publish/wwwroot"
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get Static Web App deployment token
        id: static_web_app_token
        run: |
          deployment_token=$(az staticwebapp secrets list \
            --name "swa-release-notes-${{ vars.AZURE_RESOURCE_SUFFIX }}" \
            --resource-group rg-azure-devops-release-notes \
            --query 'properties.apiKey' \
            --output tsv)
          echo "::add-mask::$deployment_token"
          echo "token=$deployment_token" >> "$GITHUB_OUTPUT"

      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.static_web_app_token.outputs.token }}
          action: "close"
